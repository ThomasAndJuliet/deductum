# Isabellum, the sibling of COSMIC Agent Terminal for Isabelle theories
# (docs/isabellum-decisions.md). This manifest packages a release binary
# built beforehand in the same SDK (`cargo build --release --bin isabellum`),
# with the session host and prover backend sources the app installs on each
# machine it connects to.
app-id: dev.twright.Isabellum
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: isabellum
appstream-compose: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The session host, ssh, tar and Isabelle run on the host through
  # flatpak-spawn --host; the runtime has none of them
  - --talk-name=org.freedesktop.Flatpak
  # `isabellum .` resolves paths as the shell sees them
  - --filesystem=home:ro
  # Terminal Agents' machines, and the desktop's theme
  - --filesystem=xdg-config/cosmic/dev.twright.CosmicTermAgents:ro
  - --filesystem=xdg-config/cosmic/com.system76.CosmicTheme.Mode:ro
  - --filesystem=xdg-config/cosmic/com.system76.CosmicTheme.Dark:ro
  - --filesystem=xdg-config/cosmic/com.system76.CosmicTheme.Light:ro
  - --filesystem=xdg-config/cosmic/com.system76.CosmicTk:ro

modules:
  - name: isabellum
    buildsystem: simple
    build-commands:
      - install -Dm755 isabellum /app/bin/isabellum
      - mkdir -p /app/share/isabellum && cp -r host backend /app/share/isabellum/
      - rm -rf /app/share/isabellum/host/tests /app/share/isabellum/host/__pycache__
        /app/share/isabellum/backend/*/lib
      - install -Dm644 dev.twright.Isabellum.desktop /app/share/applications/dev.twright.Isabellum.desktop
      - install -Dm644 dev.twright.Isabellum.svg /app/share/icons/hicolor/scalable/apps/dev.twright.Isabellum.svg
      - install -Dm644 dev.twright.Isabellum.metainfo.xml /app/share/metainfo/dev.twright.Isabellum.metainfo.xml
      - >-
        appstreamcli compose --no-net --prefix=/
        --origin=dev.twright.Isabellum --result-root=/app
        --data-dir=/app/share/app-info/xmls
        --icons-dir=/app/share/app-info/icons/flatpak
        --components=dev.twright.Isabellum /app
    sources:
      - type: file
        path: ../../target/release/isabellum
      - type: dir
        path: ../../isabellum
      - type: file
        path: ../../res/isabellum/dev.twright.Isabellum.desktop
      - type: file
        path: ../../res/isabellum/dev.twright.Isabellum.svg
      - type: file
        path: dev.twright.Isabellum.metainfo.xml
