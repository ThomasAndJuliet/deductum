app-id: dev.twright.Deductum
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: deductum
appstream-compose: false
finish-args:
- --socket=wayland
- --socket=fallback-x11
- --share=ipc
- --device=dri
- --talk-name=org.freedesktop.Flatpak
- --filesystem=home:ro
- --filesystem=xdg-config/cosmic/dev.twright.CosmicTermAgents:ro
- --filesystem=xdg-config/cosmic/com.system76.CosmicTheme.Mode:ro
- --filesystem=xdg-config/cosmic/com.system76.CosmicTheme.Dark:ro
- --filesystem=xdg-config/cosmic/com.system76.CosmicTheme.Light:ro
- --filesystem=xdg-config/cosmic/com.system76.CosmicTk:ro
modules:
- name: deductum
  buildsystem: simple
  build-commands:
  - cargo --offline --locked build --release --bin deductum
  - install -Dm755 target/release/deductum /app/bin/deductum
  - mkdir -p /app/share/deductum && cp -r deductum/host deductum/backend /app/share/deductum/
  - rm -rf /app/share/deductum/host/tests /app/share/deductum/host/__pycache__ /app/share/deductum/backend/*/lib
  - install -Dm644 res/deductum/dev.twright.Deductum.desktop /app/share/applications/dev.twright.Deductum.desktop
  - install -Dm644 res/deductum/dev.twright.Deductum.svg /app/share/icons/hicolor/scalable/apps/dev.twright.Deductum.svg
  - install -Dm644 res/icons/LICENSE.window-pop-out /app/share/licenses/deductum/LICENSE.window-pop-out
  - install -Dm644 res/icons/README.window-pop-out.md /app/share/licenses/deductum/README.window-pop-out.md
  - install -Dm644 packaging/flatpak/dev.twright.Deductum.metainfo.xml /app/share/metainfo/dev.twright.Deductum.metainfo.xml
  - appstreamcli compose --no-net --prefix=/ --origin=dev.twright.Deductum --result-root=/app --data-dir=/app/share/app-info/xmls
    --icons-dir=/app/share/app-info/icons/flatpak --components=dev.twright.Deductum /app
  sources:
  - type: dir
    path: ../..
    dest: cosmic-term
    skip:
    - target
    - build-flatpak
    - .git
    - .flatpak-builder
    - .local-design
    - ci-artifact
  - cargo-sources.json
  subdir: cosmic-term
sdk-extensions:
- org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/deductum/cargo
