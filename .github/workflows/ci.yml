name: CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
# Every release-branch push keeps its own slot, including pending runs.
# PRs and feature branches replace only superseded work for the same ref.
# libcosmic comes from the household's private fork (ThomasAndJuliet/libcosmic)
# and household-tones from ThomasAndJuliet/household-kit, fetched over ssh. The
# Flatpak job runs scripts/ci-private-crates.sh with their read-only deploy-key
# secrets first. Fork PRs and other untrusted actors receive no secrets: the
# step then fails at once with a message naming the missing secret, instead of
# a later git authentication error.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
jobs:
  already-validated:
    name: Already validated?
    # A fast-forward merge brings a commit this workflow already passed on its
    # branch: the other jobs then skip their work.
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-24.04' || 'neo-ubuntu' }}
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        uses: ThomasAndJuliet/neo-infrastructure/.github/actions/already-validated@2e9a991f7224fb1a00ab591e83fffbff2dd90667
  flatpak:
    needs: [already-validated]
    if: ${{ !cancelled() && (needs.already-validated.outputs.run == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (vars.CI_RUNNER == 'hosted') }}
    name: Deductum workspace tests and Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # A disposable build runner needs nested Flatpak sandboxes. Production
    # services on Neo retain their enforcing SELinux and restricted Quadlets.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps: &flatpak-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the build validated for this commit on its branch
        id: reuse
        if: runner.environment == 'self-hosted' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: neo-ci-build-cache reuse ci-artifact
      - name: Verify hosted-runner cleanup boundaries
        if: (runner.environment == 'github-hosted') && steps.reuse.outputs.reused != 'true'
        run: python3 scripts/test-reclaim-hosted-runner-storage.py
      - name: Reclaim unused hosted-runner toolchains before SDK updates
        if: (runner.environment == 'github-hosted') && steps.reuse.outputs.reused != 'true'
        run: python3 scripts/reclaim-hosted-runner-storage.py
      - name: Prepare the SDK test and build manifest
        if: steps.reuse.outputs.reused != 'true'
        run: python3 scripts/prepare-ci-manifest.py
      - name: Share neo's compilation cache with the Flatpak build
        if: (runner.environment == 'self-hosted') && steps.reuse.outputs.reused != 'true'
        run: neo-ci-sccache-manifest packaging/flatpak/dev.twright.Deductum.ci.yml
      - name: Let git and cargo fetch the household libcosmic fork and household-kit
        if: steps.reuse.outputs.reused != 'true'
        env:
          LIBCOSMIC_DEPLOY_KEY: ${{ secrets.LIBCOSMIC_DEPLOY_KEY }}
          HOUSEHOLD_KIT_DEPLOY_KEY: ${{ secrets.HOUSEHOLD_KIT_DEPLOY_KEY }}
        run: scripts/ci-private-crates.sh libcosmic household-kit
      - name: Check all targets, test the complete workspace and build Deductum
        if: steps.reuse.outputs.reused != 'true'
        uses: flatpak/flatpak-github-actions/flatpak-builder@0fadf5d65cdfbdb9c94c7a2f3637c41206cc1a70 # v6
        with:
          manifest-path: packaging/flatpak/dev.twright.Deductum.ci.yml
          build-dir: build-flatpak
          build-bundle: false
          upload-artifact: false
          cache: false
          branch: stable
      - name: Validate the finished package and record tested source provenance
        if: steps.reuse.outputs.reused != 'true'
        run: python3 scripts/package-ci-release.py build-flatpak
      - name: Keep this validated build on neo for its release-branch push
        if: runner.environment == 'self-hosted' && github.event_name == 'push' && github.ref != 'refs/heads/main' && steps.reuse.outputs.reused != 'true'
        run: neo-ci-build-cache store ci-artifact
      - name: Preserve this successful release-branch build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: home-apps-x86_64
          path: |
            ci-artifact/build.tar.gz
            ci-artifact/release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  # The same steps on the household runners (neo-infrastructure
  # services/ci-runners), the default. Set the CI_RUNNER variable to
  # hosted to use GitHub-hosted runners instead.
  flatpak-neo:
    needs: [already-validated]
    if: ${{ !cancelled() && (needs.already-validated.outputs.run == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (vars.CI_RUNNER != 'hosted') }}
    name: Deductum workspace tests and Flatpak on neo
    runs-on: [self-hosted, neo]
    timeout-minutes: 120
    steps: *flatpak-steps

  provers:
    needs: [already-validated]
    if: ${{ !cancelled() && needs.already-validated.outputs.run == '' }}
    name: Real Isabelle and Lean backend integrations
    # Neo's Ubuntu runner by default; CI_RUNNER=hosted uses GitHub's image.
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-24.04' || 'neo-ubuntu' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean toolchain manager
        run: |
          sudo apt-get update
          sudo apt-get install -y elan libfontconfig1 libgomp1
          elan toolchain install leanprover/lean4:v4.19.0
      - name: Download and verify the official Isabelle2025 runtime
        run: |
          curl --fail --location --retry 3 https://isabelle.in.tum.de/website-Isabelle2025/dist/Isabelle2025_linux.tar.gz -o "$RUNNER_TEMP/Isabelle2025_linux.tar.gz"
          printf '%s  %s\n' 3d1d66de371823fe31aa8ae66638f73575bac244f00b31aee1dcb62f38147c56 "$RUNNER_TEMP/Isabelle2025_linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/Isabelle2025_linux.tar.gz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/Isabelle2025_linux.tar.gz"
      - name: Test Lean driver and host core on disposable projects
        run: python3 deductum/host/tests/integration_lean.py --skip-dsrv --core-fixture "$GITHUB_WORKSPACE/scripts/ci-fixtures/lean"
      - name: Test the host against real Isabelle2025
        env:
          DEDUCTUM_ISABELLE: ${{ runner.temp }}/Isabelle2025/bin/isabelle
          DEDUCTUM_STATE_DIR: ${{ runner.temp }}/deductum-isabelle-state
        run: python3 deductum/host/tests/integration_host.py
