name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every release-branch push keeps its own slot, including pending runs.
# PRs and feature branches replace only superseded work for the same ref.
# The trust job decides what each run may use (scripts/ci-trust.py): fork pull
# requests run only on hosted runners, and no job in this workflow uses a secret.
# A fork can rewrite this file, so that is not what stops hostile code reaching
# the household runners: their runner group and fork-approval setting do.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
jobs:
  trust:
    name: Classify this run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.classify.outputs.trusted }}
      runner: ${{ steps.classify.outputs.runner }}
      flatpak: ${{ steps.classify.outputs.flatpak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: classify
        env:
          CI_RUNNER: ${{ vars.CI_RUNNER }}
        run: python3 scripts/ci-trust.py
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflow trust rules
        run: |
          python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          python3 scripts/test-ci-trust.py
      - name: Check release publication and packaging rules
        run: |
          python3 scripts/test-publish-release.py
          python3 scripts/test-submit-home-apps.py
          python3 scripts/test-release-policy.py
          python3 scripts/test-package-windows.py
          python3 scripts/test-package-macos.py
      - name: Check the Flatpak test manifest can be prepared
        run: python3 scripts/prepare-ci-manifest.py
      - name: Test the session host
        run: python3 -m unittest discover -s host/tests -p "test_*.py"
  already-validated:
    name: Already validated?
    # A fast-forward merge brings a commit this workflow already passed on its
    # branch: the other jobs then skip their work.
    needs: [trust]
    if: needs.trust.outputs.trusted == 'true'
    runs-on: ${{ needs.trust.outputs.runner }}
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-already-validated.py
  flatpak:
    needs: [trust, already-validated]
    if: ${{ !cancelled() && needs.trust.result == 'success' && needs.trust.outputs.flatpak == 'hosted' && (needs.already-validated.outputs.run == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    name: Deductum workspace tests and Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # A disposable build runner needs nested Flatpak sandboxes. Production
    # services on Neo retain their enforcing SELinux and restricted Quadlets.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps: &flatpak-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the build validated for this commit on its branch
        id: reuse
        if: runner.environment == 'self-hosted' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: neo-ci-build-cache reuse ci-artifact
      - name: Verify hosted-runner cleanup boundaries
        if: (runner.environment == 'github-hosted') && steps.reuse.outputs.reused != 'true'
        run: python3 scripts/test-reclaim-hosted-runner-storage.py
      - name: Reclaim unused hosted-runner toolchains before SDK updates
        if: (runner.environment == 'github-hosted') && steps.reuse.outputs.reused != 'true'
        run: python3 scripts/reclaim-hosted-runner-storage.py
      - name: Prepare the SDK test and build manifest
        if: steps.reuse.outputs.reused != 'true'
        run: python3 scripts/prepare-ci-manifest.py
      - name: Share neo's compilation cache with the Flatpak build
        if: (runner.environment == 'self-hosted') && steps.reuse.outputs.reused != 'true'
        run: neo-ci-sccache-manifest packaging/flatpak/dev.twright.Deductum.ci.yml
      - name: Check all targets, test the complete workspace and build Deductum
        if: steps.reuse.outputs.reused != 'true'
        uses: flatpak/flatpak-github-actions/flatpak-builder@0fadf5d65cdfbdb9c94c7a2f3637c41206cc1a70 # v6
        with:
          manifest-path: packaging/flatpak/dev.twright.Deductum.ci.yml
          build-dir: build-flatpak
          build-bundle: false
          upload-artifact: false
          cache: false
          branch: stable
      - name: Validate the finished package and record tested source provenance
        if: steps.reuse.outputs.reused != 'true'
        run: python3 scripts/package-ci-release.py build-flatpak
      - name: Keep this validated build on neo for its release-branch push
        if: runner.environment == 'self-hosted' && github.event_name == 'push' && github.ref != 'refs/heads/main' && steps.reuse.outputs.reused != 'true'
        run: neo-ci-build-cache store ci-artifact
      - name: Test standalone Flatpak installation and update
        run: python3 scripts/test-package-flatpak-bundle.py
      - name: Bundle the exact tested payload for standalone installation
        run: python3 scripts/package-flatpak-bundle.py ci-artifact
      - name: Preserve the standalone Linux package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-x86_64
          path: ci-artifact/linux/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve this successful release-branch build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: home-apps-x86_64
          path: |
            ci-artifact/build.tar.gz
            ci-artifact/release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  # The same steps on the household runners (neo-infrastructure
  # services/ci-runners), the default for this repository's own runs. Setting
  # the CI_RUNNER variable to hosted uses GitHub-hosted runners instead, as a
  # fork's pull request always does.
  flatpak-neo:
    needs: [trust, already-validated]
    if: ${{ !cancelled() && needs.trust.outputs.trusted == 'true' && needs.trust.outputs.flatpak == 'neo' && (needs.already-validated.outputs.run == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    name: Deductum workspace tests and Flatpak on neo
    runs-on: [self-hosted, neo]
    timeout-minutes: 120
    steps: *flatpak-steps

  provers:
    needs: [trust, already-validated]
    if: ${{ !cancelled() && needs.trust.result == 'success' && needs.already-validated.outputs.run == '' }}
    name: Real Isabelle and Lean backend integrations
    # Fetches no private crate and uses no secret, so a fork's run keeps it.
    runs-on: ${{ needs.trust.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean toolchain manager
        run: |
          sudo apt-get update
          sudo apt-get install -y elan libfontconfig1 libgomp1
          elan toolchain install leanprover/lean4:v4.19.0
      - name: Download and verify the official Isabelle2025 runtime
        run: |
          curl --fail --location --retry 3 https://isabelle.in.tum.de/website-Isabelle2025/dist/Isabelle2025_linux.tar.gz -o "$RUNNER_TEMP/Isabelle2025_linux.tar.gz"
          printf '%s  %s\n' 3d1d66de371823fe31aa8ae66638f73575bac244f00b31aee1dcb62f38147c56 "$RUNNER_TEMP/Isabelle2025_linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/Isabelle2025_linux.tar.gz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/Isabelle2025_linux.tar.gz"
      - name: Test Lean driver and host core on disposable projects
        run: python3 host/tests/integration_lean.py --skip-dsrv --core-fixture "$GITHUB_WORKSPACE/scripts/ci-fixtures/lean"
      - name: Test the host against real Isabelle2025
        env:
          DEDUCTUM_ISABELLE: ${{ runner.temp }}/Isabelle2025/bin/isabelle
          DEDUCTUM_STATE_DIR: ${{ runner.temp }}/deductum-isabelle-state
        run: python3 host/tests/integration_host.py

  windows-build:
    name: Native Windows portable package
    needs: [trust]
    runs-on: ${{ needs.trust.outputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Windows cross compiler and Rust target
        env:
          CARGO_HOME: ${{ runner.temp }}/deductum-windows-cargo
          RUSTUP_HOME: ${{ runner.temp }}/deductum-windows-rustup
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          curl --proto '=https' --tlsv1.2 --fail --location https://sh.rustup.rs --output "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain 1.99.0 --target x86_64-pc-windows-gnu
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$CARGO_HOME" "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Build the app and its complete Windows test executable
        run: |
          cargo +1.99.0 build --locked --release --bin deductum --no-default-features --features wgpu --target x86_64-pc-windows-gnu
          cargo +1.99.0 test --locked --release --no-run --bin deductum --no-default-features --features wgpu --target x86_64-pc-windows-gnu --message-format=json > "$RUNNER_TEMP/windows-tests.jsonl"
          python3 -c 'import json,os,pathlib,shutil; rows=(json.loads(s) for s in pathlib.Path(os.environ["RUNNER_TEMP"],"windows-tests.jsonl").read_text().splitlines()); tests=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="deductum" and r.get("profile",{}).get("test") and r.get("executable")]; assert len(tests)==1,tests; pathlib.Path("dist/windows").mkdir(parents=True,exist_ok=True); shutil.copy2(tests[0],"dist/windows/deductum-tests.exe")'
      - name: Check packaging and assemble the exact source revision
        run: |
          python3 scripts/test-package-windows.py
          python3 scripts/package-windows.py
      - name: Fetch and verify the Windows Isabelle test runtime
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, time, urllib.request
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-test-provers'
          directory.mkdir()
          destination = directory / 'Isabelle2025.exe'
          partial = destination.with_suffix('.part')
          for attempt in range(3):
              try:
                  with urllib.request.urlopen('https://isabelle.in.tum.de/website-Isabelle2025/dist/Isabelle2025.exe', timeout=180) as source, partial.open('wb') as target:
                      shutil.copyfileobj(source, target)
                  with partial.open('rb') as source:
                      assert hashlib.file_digest(source, 'sha256').hexdigest() == '5225d0e28a3c9cb3e4e348b508d332165c65b806201f3936a7a861a6bb39a748', 'Windows Isabelle checksum mismatch'
                  partial.replace(destination)
                  break
              except Exception:
                  partial.unlink(missing_ok=True)
                  if attempt == 2:
                      raise
                  time.sleep(5 * (attempt + 1))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x86_64
          path: |
            dist/windows/*.zip
            dist/windows/*.json
            dist/windows/deductum-tests.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-test-provers
          path: ${{ runner.temp }}/windows-test-provers/Isabelle2025.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-build:
    name: Native macOS universal package
    # Always GitHub-hosted: the household has no Mac, and the job uses no secret.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust with both macOS targets
        env:
          CARGO_HOME: ${{ runner.temp }}/deductum-macos-cargo
          RUSTUP_HOME: ${{ runner.temp }}/deductum-macos-rustup
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location https://sh.rustup.rs --output "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain 1.99.0 --target aarch64-apple-darwin --target x86_64-apple-darwin
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$CARGO_HOME" "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Build the app for both architectures
        run: |
          cargo +1.99.0 build --locked --release --bin deductum --no-default-features --features wgpu --target aarch64-apple-darwin
          cargo +1.99.0 build --locked --release --bin deductum --no-default-features --features wgpu --target x86_64-apple-darwin
      - name: Check packaging and assemble the exact source revision
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python3 scripts/test-package-macos.py
          python3 scripts/package-macos.py
      - name: Smoke-test the finished package
        run: |
          set -eu
          zips=(dist/macos/*.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "Expected exactly one macOS package"; exit 1; }
          # The publisher refuses a public package naming household systems: find that here
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import release_scan; found = release_scan.scan_zip(sys.argv[1]); assert not found, found' "${zips[0]}"
          extracted="$(mktemp -d "$RUNNER_TEMP/macos-package.XXXXXX")"
          ditto -x -k "${zips[0]}" "$extracted"
          package="$(echo "$extracted"/deductum-*-macos-universal)"
          binary="$package/deductum"
          lipo -info "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          expected="$(git rev-parse HEAD)"
          check_build_info() {
            "$@" --build-info | python3 -c 'import json,sys; info=json.load(sys.stdin); print(info); assert info["source_sha"]==sys.argv[1] and info["source_dirty"] is False, info' "$expected"
          }
          check_build_info "$binary"
          rosetta=false
          if arch -x86_64 /usr/bin/true 2>/dev/null; then rosetta=true; fi
          if [ "$rosetta" = true ]; then
            check_build_info arch -x86_64 "$binary"
          else
            echo "::notice::Rosetta is not available on this runner, so the x86_64 slice and runtime were not run."
          fi
          "$package/python/arm64/bin/python3" -c 'import sys; print(sys.version)'
          if [ "$rosetta" = true ]; then
            arch -x86_64 "$package/python/x86_64/bin/python3" -c 'import platform,sys; print(platform.machine(), sys.version)'
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-universal
          path: |
            dist/macos/*.zip
            dist/macos/*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-native:
    name: Windows native host, app and real provers
    needs: [windows-build]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x86_64
          path: ${{ runner.temp }}/deductum-artifact
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-test-provers
          path: ${{ runner.temp }}/windows-test-provers
      - name: Verify the source identity before standard-user execution
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem "$env:RUNNER_TEMP/deductum-artifact" -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows package' }
          $receipt = Get-Content ([IO.Path]::ChangeExtension($zip[0].FullName, '.json')) -Raw | ConvertFrom-Json
          if ($receipt.source_sha -ne (git rev-parse HEAD) -or $receipt.source_dirty) { throw 'Package is not this clean source revision' }
      - name: Run the full native suite and real provers as a standard user
        shell: pwsh
        run: ./scripts/run-windows-native-ci.ps1
