name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every release-branch push keeps its own slot, including pending runs.
# PRs and feature branches replace only superseded work for the same ref.
# libcosmic comes from the household's private fork (ThomasAndJuliet/libcosmic)
# and household-tones from ThomasAndJuliet/household-kit, fetched over ssh. The
# Flatpak job runs scripts/ci-private-crates.sh with their read-only deploy-key
# secrets first. Fork PRs and other untrusted actors receive no secrets: the
# step then fails at once with a message naming the missing secret, instead of
# a later git authentication error.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
jobs:
  already-validated:
    name: Already validated?
    # A fast-forward merge brings a commit this workflow already passed on its
    # branch: the other jobs then skip their work.
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-24.04' || 'neo-ubuntu' }}
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        uses: ThomasAndJuliet/neo-infrastructure/.github/actions/already-validated@2e9a991f7224fb1a00ab591e83fffbff2dd90667
  flatpak:
    needs: [already-validated]
    if: ${{ !cancelled() && (needs.already-validated.outputs.run == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (vars.CI_RUNNER == 'hosted') }}
    name: Deductum workspace tests and Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # A disposable build runner needs nested Flatpak sandboxes. Production
    # services on Neo retain their enforcing SELinux and restricted Quadlets.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps: &flatpak-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the build validated for this commit on its branch
        id: reuse
        if: runner.environment == 'self-hosted' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: neo-ci-build-cache reuse ci-artifact
      - name: Verify hosted-runner cleanup boundaries
        if: (runner.environment == 'github-hosted') && steps.reuse.outputs.reused != 'true'
        run: python3 scripts/test-reclaim-hosted-runner-storage.py
      - name: Reclaim unused hosted-runner toolchains before SDK updates
        if: (runner.environment == 'github-hosted') && steps.reuse.outputs.reused != 'true'
        run: python3 scripts/reclaim-hosted-runner-storage.py
      - name: Prepare the SDK test and build manifest
        if: steps.reuse.outputs.reused != 'true'
        run: python3 scripts/prepare-ci-manifest.py
      - name: Share neo's compilation cache with the Flatpak build
        if: (runner.environment == 'self-hosted') && steps.reuse.outputs.reused != 'true'
        run: neo-ci-sccache-manifest packaging/flatpak/dev.twright.Deductum.ci.yml
      - name: Let git and cargo fetch the household libcosmic fork and household-kit
        if: steps.reuse.outputs.reused != 'true'
        env:
          LIBCOSMIC_DEPLOY_KEY: ${{ secrets.LIBCOSMIC_DEPLOY_KEY }}
          HOUSEHOLD_KIT_DEPLOY_KEY: ${{ secrets.HOUSEHOLD_KIT_DEPLOY_KEY }}
        run: scripts/ci-private-crates.sh libcosmic household-kit
      - name: Check all targets, test the complete workspace and build Deductum
        if: steps.reuse.outputs.reused != 'true'
        uses: flatpak/flatpak-github-actions/flatpak-builder@0fadf5d65cdfbdb9c94c7a2f3637c41206cc1a70 # v6
        with:
          manifest-path: packaging/flatpak/dev.twright.Deductum.ci.yml
          build-dir: build-flatpak
          build-bundle: false
          upload-artifact: false
          cache: false
          branch: stable
      - name: Validate the finished package and record tested source provenance
        if: steps.reuse.outputs.reused != 'true'
        run: python3 scripts/package-ci-release.py build-flatpak
      - name: Keep this validated build on neo for its release-branch push
        if: runner.environment == 'self-hosted' && github.event_name == 'push' && github.ref != 'refs/heads/main' && steps.reuse.outputs.reused != 'true'
        run: neo-ci-build-cache store ci-artifact
      - name: Preserve this successful release-branch build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: home-apps-x86_64
          path: |
            ci-artifact/build.tar.gz
            ci-artifact/release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  # The same steps on the household runners (neo-infrastructure
  # services/ci-runners), the default. Set the CI_RUNNER variable to
  # hosted to use GitHub-hosted runners instead.
  flatpak-neo:
    needs: [already-validated]
    if: ${{ !cancelled() && (needs.already-validated.outputs.run == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (vars.CI_RUNNER != 'hosted') }}
    name: Deductum workspace tests and Flatpak on neo
    runs-on: [self-hosted, neo]
    timeout-minutes: 120
    steps: *flatpak-steps

  provers:
    needs: [already-validated]
    if: ${{ !cancelled() && needs.already-validated.outputs.run == '' }}
    name: Real Isabelle and Lean backend integrations
    # Neo's Ubuntu runner by default; CI_RUNNER=hosted uses GitHub's image.
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-24.04' || 'neo-ubuntu' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean toolchain manager
        run: |
          sudo apt-get update
          sudo apt-get install -y elan libfontconfig1 libgomp1
          elan toolchain install leanprover/lean4:v4.19.0
      - name: Download and verify the official Isabelle2025 runtime
        run: |
          curl --fail --location --retry 3 https://isabelle.in.tum.de/website-Isabelle2025/dist/Isabelle2025_linux.tar.gz -o "$RUNNER_TEMP/Isabelle2025_linux.tar.gz"
          printf '%s  %s\n' 3d1d66de371823fe31aa8ae66638f73575bac244f00b31aee1dcb62f38147c56 "$RUNNER_TEMP/Isabelle2025_linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/Isabelle2025_linux.tar.gz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/Isabelle2025_linux.tar.gz"
      - name: Test Lean driver and host core on disposable projects
        run: python3 deductum/host/tests/integration_lean.py --skip-dsrv --core-fixture "$GITHUB_WORKSPACE/scripts/ci-fixtures/lean"
      - name: Test the host against real Isabelle2025
        env:
          DEDUCTUM_ISABELLE: ${{ runner.temp }}/Isabelle2025/bin/isabelle
          DEDUCTUM_STATE_DIR: ${{ runner.temp }}/deductum-isabelle-state
        run: python3 deductum/host/tests/integration_host.py

  windows-build:
    name: Native Windows portable package
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-24.04' || 'neo-ubuntu' }}
    timeout-minutes: 90
    env:
      CARGO_HOME: ${{ runner.temp }}/deductum-windows-cargo
      RUSTUP_HOME: ${{ runner.temp }}/deductum-windows-rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Windows cross compiler and Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          curl --proto '=https' --tlsv1.2 --fail --location https://sh.rustup.rs --output "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain 1.99.0 --target x86_64-pc-windows-gnu
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Fetch the private toolkit with read-only build identities
        env:
          LIBCOSMIC_DEPLOY_KEY: ${{ secrets.LIBCOSMIC_DEPLOY_KEY }}
          HOUSEHOLD_KIT_DEPLOY_KEY: ${{ secrets.HOUSEHOLD_KIT_DEPLOY_KEY }}
        run: scripts/ci-private-crates.sh libcosmic household-kit
      - name: Build the app and its complete Windows test executable
        run: |
          cargo +1.99.0 build --locked --release --bin deductum --no-default-features --features wgpu --target x86_64-pc-windows-gnu
          cargo +1.99.0 test --locked --release --no-run --bin deductum --no-default-features --features wgpu --target x86_64-pc-windows-gnu --message-format=json > "$RUNNER_TEMP/windows-tests.jsonl"
          python3 -c 'import json,os,pathlib,shutil; rows=(json.loads(s) for s in pathlib.Path(os.environ["RUNNER_TEMP"],"windows-tests.jsonl").read_text().splitlines()); tests=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="deductum" and r.get("profile",{}).get("test") and r.get("executable")]; assert len(tests)==1,tests; pathlib.Path("dist/windows").mkdir(parents=True,exist_ok=True); shutil.copy2(tests[0],"dist/windows/deductum-tests.exe")'
      - name: Check packaging and assemble the exact source revision
        run: |
          python3 scripts/test-package-windows.py
          python3 scripts/package-windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x86_64
          path: |
            dist/windows/*.zip
            dist/windows/*.json
            dist/windows/deductum-tests.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-native:
    name: Windows native host, app and real provers
    needs: [windows-build]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x86_64
          path: ${{ runner.temp }}/deductum-artifact
      - name: Extract and verify the portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'deductum-artifact'
          $zip = @(Get-ChildItem $artifact -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows package' }
          $receipt = Get-Content ([IO.Path]::ChangeExtension($zip[0].FullName, '.json')) -Raw | ConvertFrom-Json
          if ($receipt.source_sha -ne (git rev-parse HEAD) -or $receipt.source_dirty) { throw 'Package is not this clean source revision' }
          if ((Get-FileHash $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $receipt.archive_sha256) { throw 'Package checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'deductum-native'
          Expand-Archive $zip[0].FullName $destination
          $package = @(Get-ChildItem $destination -Directory)
          if ($package.Count -ne 1) { throw 'Expected one package root' }
          "DEDUCTUM_PACKAGE=$($package[0].FullName)" >> $env:GITHUB_ENV
          "DEDUCTUM_TEST_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
      - name: Install checksum-pinned native test provers
        shell: pwsh
        run: ./scripts/install-windows-test-provers.ps1
      - name: Run the full shared host and native app tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:DEDUCTUM_PACKAGE 'python/python.exe'
          & $python -X utf8 -m unittest discover -s deductum/host/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows host tests failed' }
          & "$env:RUNNER_TEMP/deductum-artifact/deductum-tests.exe" --test-threads=4
          if ($LASTEXITCODE -ne 0) { throw 'Windows app tests failed' }
      - name: Run real native Lean and Isabelle integrations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:DEDUCTUM_PACKAGE 'python/python.exe'
          $env:DEDUCTUM_STATE_DIR = Join-Path $env:RUNNER_TEMP 'deductum-isabelle-state'
          & $python -X utf8 deductum/host/tests/integration_lean.py --skip-dsrv --core-fixture "$env:GITHUB_WORKSPACE/scripts/ci-fixtures/lean"
          if ($LASTEXITCODE -ne 0) { throw 'Native Lean integration failed' }
          & $python -X utf8 deductum/host/tests/integration_host.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Isabelle integration failed' }
