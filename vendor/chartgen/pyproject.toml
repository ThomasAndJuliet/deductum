[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "chartgen"
version = "0.1.0"
description = "Layered Rust chart engine with Python and document integrations"
requires-python = ">=3.10"
dependencies = ["figkit==0.1.0"]

[project.optional-dependencies]
typst = ["typst>=0.13"]
test = ["pytest>=8"]

[project.scripts]
chartgen = "chartgen.__main__:main"

[tool.maturin]
manifest-path = "crates/chartgen-python/Cargo.toml"
python-source = "python"
module-name = "chartgen._native"

python-packages = ["chartgen"]
