[workspace]
resolver = "2"
members = ["crates/*", "experimental/*", "tests/rulings"]
default-members = ["crates/chartgen"]
# The private sandbox (an ignored, separate git repository) is never a member.
exclude = ["sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2"
rust_decimal = { version = "1", features = ["serde-with-str"] }
chartgen-model = { path = "crates/chartgen-model" }
chartgen-geometry = { path = "crates/chartgen-geometry" }
chartgen-style = { path = "crates/chartgen-style" }
chartgen = { path = "crates/chartgen" }
