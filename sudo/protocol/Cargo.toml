[package]
name = "ct-sudo-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "What COSMIC Terminal's sudo agent and PAM module say to each other"

[features]
default = ["verify"]
# What the PAM module needs, and no more: it runs inside sudo, as root
verify = ["dep:ssh-key"]
# What the agent needs: making, decrypting and signing with keys
sign = ["verify", "ssh-key/encryption", "ssh-key/getrandom", "ssh-key/rand_core"]

[dependencies]
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "std", "ed25519"], optional = true }
