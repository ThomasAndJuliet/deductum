# cosmic-theme = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# iced_futures = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# iced_winit = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }

# The sudo agent's protocol, and the PAM module that uses it; see AGENTS-PLAN.md
[workspace]
members = ["sudo/protocol", "sudo/pam", "prose/prose-render"]
exclude = ["vendor/alacritty_terminal", "vendor/vte", "vendor/chartgen"]

# libcosmic and its iced from the household fork (ThomasAndJuliet/libcosmic,
# branch household, read over ssh); HOUSEHOLD.md there says what it changes and
# how to move this pin. Every crate the lock takes from pop-os/libcosmic.
[patch."https://github.com/pop-os/libcosmic.git"]
libcosmic = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
build_helpers = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
cosmic-config = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
cosmic-config-derive = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
cosmic-theme = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_accessibility = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_core = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_debug = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_futures = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_graphics = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_program = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_renderer = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_runtime = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_tiny_skia = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_wgpu = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_widget = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
iced_winit = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }

# XTWINOPS 16 (cell size in pixels) answered; see vendor/README.md
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }

# The store's key derivation is slow on purpose; unoptimized, it is far slower
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The whole pop-os/winit family from the same fork (HOUSEHOLD.md), which fixes
# the "failed to get pointer data" panic. Its winit crates refer to each other
# by path, so redirecting winit-wayland alone would bring a second winit-core.
[patch."https://github.com/pop-os/winit.git"]
dpi = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-android = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-appkit = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-common = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-core = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-orbital = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-uikit = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-wayland = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-web = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-win32 = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
winit-x11 = { git = "ssh://git@github.com/ThomasAndJuliet/libcosmic.git", rev = "b44caa8154cea3a582e85faec63226d86317fa7f" }
