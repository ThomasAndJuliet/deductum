[package]
name = "cosmic-term"
version = "1.9.0"
authors = ["Jeremy Soller <jeremy@system76.com>"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
alacritty_terminal = "0.25.1"
hex_color = { version = "3", features = ["serde"] }
indexmap = "2"
libc = "0.2"
log = "0.4"
open = "5.3.2"
paste = "1.0"
regex = "1"
ron = "0.11"
serde_json = "1"
serde = { version = "1", features = ["serde_derive"] }
shlex = "1"
# Windows are separate processes; they find and ask each other over D-Bus
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "time", "macros", "net"] }
# The sudo agent's protocol and keys; see AGENTS-PLAN.md, "Sudo from agents"
ct-sudo-protocol = { path = "sudo/protocol", features = ["sign"] }
futures-util = "0.3"
# The secrets store: an Argon2id key from the store password seals it with
# XChaCha20-Poly1305
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
zeroize = { version = "1", features = ["derive"] }
# The sudo agent's pow, as its static build has no libm
libm = "0.2"
# CLI arguments
clap_lex = "0.7"
# Internationalization
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
icu = { version = "2.1.1", features = ["compiled_data"] }
rust-embed = "8"
url = "2.5"
# Agent threads: assistant markdown, and its LaTeX set as KaTeX does
pulldown-cmark = { version = "0.13", default-features = false }
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
# Decoders for the images threads show; iced's own build has none
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# The size of an SVG image, which iced draws with resvg
usvg = { version = "0.45", default-features = false }
# Charts in threads, drawn natively; from the shared diagrams repository
chartgen = { path = "chartgen-src/crates/chartgen" }
secret-service = { version = "5.1.0", features = [
    "rt-tokio-crypto-rust",
], optional = true }
thiserror = { version = "2.0", optional = true }
secstr = { version = "0.5", optional = true }

[dependencies.cosmic-files]
git = "https://github.com/pop-os/cosmic-files.git"
default-features = false

[dependencies.cosmic-text]
version = "0.19"
features = ["monospace_fallback", "shape-run-cache"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
#TODO: a11y feature crashes file chooser dialog
features = [
    "about",
    "autosize",
    "multi-window",
    "tokio",
    "winit",
    "surface-message",
]

[target.'cfg(unix)'.dependencies]
fork = "0.4"

[build-dependencies]
xdgen = "0.1"

[features]
default = ["dbus-config", "wgpu", "wayland", "password_manager"]
dbus-config = ["libcosmic/dbus-config"]
wgpu = ["libcosmic/wgpu", "cosmic-files/wgpu"]
wayland = ["libcosmic/wayland", "cosmic-files/wayland"]
password_manager = ["secret-service", "thiserror", "secstr"]

[profile.release-with-debug]
inherits = "release"
debug = true

# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
# iced_futures = { path = "../libcosmic/iced/futures" }
# iced_winit = { path = "../libcosmic/iced/winit" }
# libcosmic = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# cosmic-config = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# cosmic-theme = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# iced_futures = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# iced_winit = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }

# libcosmic is vendored as a git subtree, carrying local changes; see
# libcosmic/ and `git log -- libcosmic`
# The sudo agent's protocol, and the PAM module that uses it; see AGENTS-PLAN.md
[workspace]
members = [".", "sudo/protocol", "sudo/pam"]
exclude = ["libcosmic", "vendor"]

[patch."https://github.com/pop-os/libcosmic.git"]
libcosmic = { path = "libcosmic" }

# XTWINOPS 16 (cell size in pixels) answered; see vendor/README.md
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }

# The store's key derivation is slow on purpose; unoptimized, it is far slower
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
