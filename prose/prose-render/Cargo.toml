[package]
name = "prose-render"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Markdown rendered for COSMIC: selectable rich text with LaTeX, Mermaid diagrams, charts and images"

[dependencies]
# Each app patches this to its own libcosmic subtree
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false }
cosmic-text = { version = "0.19", features = ["monospace_fallback", "shape-run-cache"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# The size of an SVG image, which iced draws with resvg
usvg = { version = "0.45", default-features = false, features = ["text"] }
chartgen = { path = "../../../chartgen-src/crates/chartgen" }
merman = { version = "0.8", default-features = false, features = [
    "svg",
    "layout-cytoscape",
    "diagram-flowchart",
    "diagram-sequence",
    "diagram-class",
    "diagram-state",
    "diagram-er",
    "diagram-architecture",
    "diagram-c4",
    "diagram-mindmap",
    "diagram-timeline",
    "diagram-gantt",
    "diagram-pie",
] }
serde_json = "1"
# Code coloured by language, with Sublime Text's grammars, in pure Rust
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
log = "0.4"
